<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중력 & 행성 운동 시뮬레이터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background-color: #05050a; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI 컨트롤 패널 */
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(18, 18, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 310px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            user-select: none;
        }

        h2 { font-size: 1.05rem; margin-bottom: 12px; color: #4facfe; text-transform: uppercase; letter-spacing: 1px; }
        .control-group { margin-bottom: 14px; }
        label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: #ddd; }
        input[type="range"] { width: 100%; accent-color: #4facfe; cursor: pointer; }
        input[type="color"] { width: 100%; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: transparent; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        button {
            background: #2a2a40;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        button:hover { background: #3a3a58; border-color: #4facfe; }
        button.active { background: #4facfe; color: #000; font-weight: bold; }
        
        .instructions {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #aaaabb;
            line-height: 1.5;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="ui">
        <h2>🪐 행성 설정</h2>
        
        <div class="control-group">
            <label>질량 (Mass): <span id="massVal">1000</span></label>
            <input type="range" id="mass" min="1" max="20000" value="1000">
        </div>

        <div class="control-group">
            <label>행성 색상</label>
            <input type="color" id="color" value="#00d2ff">
        </div>

        <div class="control-group">
            <label>시뮬레이션 속도: <span id="speedVal">1x</span></label>
            <input type="range" id="speed" min="0" max="3" step="0.1" value="1">
        </div>

        <div class="btn-grid">
            <button id="toggleBtn">일시정지</button>
            <button id="clearBtn">모두 삭제</button>
        </div>

        <h2 style="margin-top: 18px;">✨ 프리셋 로드</h2>
        <div class="btn-grid">
            <button onclick="loadPreset('solar')">태양계</button>
            <button onclick="loadPreset('binary')">쌍성계</button>
            <button onclick="loadPreset('threebody')">삼체 문제</button>
            <button onclick="loadPreset('chaos')">혼돈 (클러스터)</button>
        </div>

        <div class="instructions">
            🎮 <b>조작 방법:</b><br>
            • <b>클릭 후 드래그:</b> 새 행성 생성 (새총 방식)<br>
            • 반대 방향으로 멀리 당길수록 발사 속도가 빨라집니다.<br>
            • 두 행성이 충돌하면 질량과 운동량이 합쳐집니다!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // UI 요소
        const massInput = document.getElementById('mass');
        const massVal = document.getElementById('massVal');
        const colorInput = document.getElementById('color');
        const speedInput = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        const toggleBtn = document.getElementById('toggleBtn');
        const clearBtn = document.getElementById('clearBtn');

        massInput.addEventListener('input', (e) => massVal.textContent = e.target.value);
        speedInput.addEventListener('input', (e) => {
            simSpeed = parseFloat(e.target.value);
            speedVal.textContent = simSpeed + 'x';
        });

        let isPaused = false;
        let simSpeed = 1;

        toggleBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            toggleBtn.textContent = isPaused ? '재생' : '일시정지';
            toggleBtn.classList.toggle('active', isPaused);
        });

        clearBtn.addEventListener('click', () => { bodies = []; });

        // 물리 상수 설정
        const G = 1; // 만유인력 상수 (시뮬레이션 스케일용)
        const SOFTENING = 25; // 근접 시 무한대 힘 발생 방지
        let bodies = [];

        class Body {
            constructor(x, y, vx, vy, mass, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.color = color;
                this.radius = Math.max(2.5, Math.pow(mass, 1/3) * 1.5); // 질량에 비례한 반지름
                this.trail = [];
                this.maxTrail = 120;
            }

            updatePosition(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // 궤적 생성
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) {
                    this.trail.shift();
                }
            }

            draw() {
                // 궤적 그리기
                if (this.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.strokeStyle = this.color + '44';
                    ctx.lineWidth = Math.min(this.radius * 0.4, 2);
                    ctx.stroke();
                }

                // 천체 그리기
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.radius * 2;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // 초기화
            }
        }

        // 마우스 상호작용
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;

        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            currentX = e.clientX;
            currentY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                currentX = e.clientX;
                currentY = e.clientY;
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (isDragging && e.button === 0) {
                isDragging = false;
                const mass = parseFloat(massInput.value);
                const color = colorInput.value;
                
                // 마우스 드래그 반대 방향으로 속도 지정 (새총 효과)
                const vx = (startX - currentX) * 0.04;
                const vy = (startY - currentY) * 0.04;

                bodies.push(new Body(startX, startY, vx, vy, mass, color));
            }
        });

        // 물리 연산 루프
        function step(dt) {
            if (dt === 0) return;

            // 1. 만유인력 계산 (N-Body Physics)
            for (let i = 0; i < bodies.length; i++) {
                let fx = 0;
                let fy = 0;

                for (let j = 0; j < bodies.length; j++) {
                    if (i === j) continue;

                    const dx = bodies[j].x - bodies[i].x;
                    const dy = bodies[j].y - bodies[i].y;
                    const distSq = dx * dx + dy * dy + SOFTENING;
                    const dist = Math.sqrt(distSq);

                    // F = G * m1 * m2 / r^2
                    const force = (G * bodies[i].mass * bodies[j].mass) / distSq;

                    fx += force * (dx / dist);
                    fy += force * (dy / dist);
                }

                bodies[i].vx += (fx / bodies[i].mass) * dt;
                bodies[i].vy += (fy / bodies[i].mass) * dt;
            }

            // 2. 충돌 처리 (비탄성 충돌: 완전 합체 및 운동량 보존)
            for (let i = 0; i < bodies.length; i++) {
                for (let j = i + 1; j < bodies.length; j++) {
                    const b1 = bodies[i];
                    const b2 = bodies[j];

                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // 두 행성이 접촉했을 때
                    if (dist < b1.radius + b2.radius) {
                        const totalMass = b1.mass + b2.mass;
                        // 완전 비탄성 충돌 공식: v' = (m1*v1 + m2*v2) / (m1 + m2)
                        const newVx = (b1.vx * b1.mass + b2.vx * b2.mass) / totalMass;
                        const newVy = (b1.vy * b1.mass + b2.vy * b2.mass) / totalMass;

                        if (b1.mass >= b2.mass) {
                            b1.mass = totalMass;
                            b1.vx = newVx;
                            b1.vy = newVy;
                            b1.radius = Math.max(2.5, Math.pow(totalMass, 1/3) * 1.5);
                            bodies.splice(j, 1);
                            j--;
                        } else {
                            b2.mass = totalMass;
                            b2.vx = newVx;
                            b2.vy = newVy;
                            b2.radius = Math.max(2.5, Math.pow(totalMass, 1/3) * 1.5);
                            bodies.splice(i, 1);
                            i--;
                            break;
                        }
                    }
                }
            }

            // 3. 위치 업데이트
            for (let body of bodies) {
                body.updatePosition(dt);
            }
        }

        // 프리셋 로더
        function loadPreset(type) {
            bodies = [];
            const cx = width / 2;
            const cy = height / 2;

            if (type === 'solar') {
                // 항성 (태양)
                bodies.push(new Body(cx, cy, 0, 0, 15000, '#ffcc00'));

                // 행성들 (원운동 속도 공식: v = sqrt(G * M / r))
                const orbits = [
                    { r: 120, m: 10, color: '#ff5555' },
                    { r: 200, m: 25, color: '#55ff55' },
                    { r: 300, m: 50, color: '#00d2ff' },
                    { r: 430, m: 100, color: '#ffaa00' }
                ];

                orbits.forEach(p => {
                    const v = Math.sqrt((G * 15000) / p.r);
                    bodies.push(new Body(cx, cy - p.r, v, 0, p.m, p.color));
                });

                // 3번째 행성의 위성 (달)
                const earth = bodies[3];
                const moonR = 28;
                const moonV = Math.sqrt((G * earth.mass) / moonR);
                bodies.push(new Body(earth.x, earth.y - moonR, earth.vx + moonV, earth.vy, 1, '#ffffff'));

            } else if (type === 'binary') {
                const dist = 140;
                const m = 6000;
                const v = Math.sqrt((G * m) / (2 * dist));

                bodies.push(new Body(cx - dist, cy, 0, v, m, '#ff3366'));
                bodies.push(new Body(cx + dist, cy, 0, -v, m, '#33ccff'));

                // 주변 소행성 지대
                for (let i = 0; i < 25; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = 300 + Math.random() * 120;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;
                    const orbitalV = Math.sqrt((G * m * 2) / r);
                    bodies.push(new Body(x, y, -Math.sin(angle) * orbitalV, Math.cos(angle) * orbitalV, 4, '#aaaaaa'));
                }

            } else if (type === 'threebody') {
                const m = 4000;
                const dist = 160;
                const h = dist * Math.sqrt(3) / 2;

                bodies.push(new Body(cx, cy - (2/3)*h, 1.4, 0, m, '#ff0055'));
                bodies.push(new Body(cx - dist/2, cy + (1/3)*h, -0.7, 1.2, m, '#00ffaa'));
                bodies.push(new Body(cx + dist/2, cy + (1/3)*h, -0.7, -1.2, m, '#00aaff'));

            } else if (type === 'chaos') {
                for (let i = 0; i < 90; i++) {
                    const x = cx + (Math.random() - 0.5) * 600;
                    const y = cy + (Math.random() - 0.5) * 600;
                    const vx = (Math.random() - 0.5) * 2;
                    const vy = (Math.random() - 0.5) * 2;
                    const mass = Math.random() * 60 + 10;
                    const colors = ['#ff4b5c', '#43d8c9', '#95389e', '#f8dc81', '#ffffff'];
                    bodies.push(new Body(x, y, vx, vy, mass, colors[i % colors.length]));
                }
            }
        }

        // 기본 상태: 태양계 로드
        loadPreset('solar');

        // 메인 애니메이션 루프
        function animate() {
            // 잔상 효과를 위한 반투명 덮어쓰기
            ctx.fillStyle = 'rgba(5, 5, 10, 0.25)';
            ctx.fillRect(0, 0, width, height);

            if (!isPaused) {
                // 서브스텝 연산으로 오차 및 터짐 방지
                const subSteps = 4;
                const dt = (0.2 * simSpeed) / subSteps;
                for (let i = 0; i < subSteps; i++) {
                    step(dt);
                }
            }

            // 행성 그리기
            for (let body of bodies) {
                body.draw();
            }

            // 마우스 드래그 가이드라인 (새총 궤적)
            if (isDragging) {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(currentX, currentY);
                ctx.strokeStyle = '#rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.stroke();
                ctx.setLineDash([]);

                // 생성될 행성 가상 조준점
                ctx.beginPath();
                ctx.arc(startX, startY, Math.max(2.5, Math.pow(parseFloat(massInput.value), 1/3) * 1.5), 0, Math.PI * 2);
                ctx.fillStyle = colorInput.value;
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
